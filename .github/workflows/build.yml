name: Сборка

on:
  push:
  workflow_dispatch:
    inputs:
      compare_reference:
        description: Сравнить прогресс с эталоном 175
        type: boolean
        default: false

jobs:
  debug-apk:
    if: ${{ !inputs.compare_reference }}
    name: Сборка debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установка пакетов Android SDK
        run: |
          set +e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT" ANDROID_HOME="$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || true
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /tmp/licenses.log 2>&1
          "$SDKMANAGER" --list_installed > /tmp/installed.log 2>&1
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" > /tmp/sdk.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(tail -n 30 /tmp/sdk.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=SDK install failed::$msg"
            exit $code
          fi

      - name: Юнит-тесты (регрессия OOM в манифесте)
        run: |
          set +e
          ./gradlew :apkEditor:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace > /tmp/test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -A 12 -m 1 -E "^FAILURE:|What went wrong|FAILED" /tmp/test.log | head -n 40 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -z "$msg" ] && msg=$(tail -n 30 /tmp/test.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Unit tests failed::$msg"
            tail -n 60 /tmp/test.log
            exit $code
          fi
          tail -n 15 /tmp/test.log

      - name: Сборка debug APK
        run: |
          set +e
          ./gradlew :apkEditorPro:assembleDebug --no-daemon --max-workers=2 --stacktrace > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -A 12 -m 1 -E "^FAILURE:|What went wrong" /tmp/build.log | head -n 40 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -z "$msg" ] && msg=$(tail -n 30 /tmp/build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            tail -n 60 /tmp/build.log
            exit $code
          fi
          tail -n 15 /tmp/build.log

      - name: Отчёт об ошибке
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Диагностика сборки'
            echo '```'
            for f in /tmp/installed.log /tmp/sdk.log /tmp/test.log /tmp/build.log; do
              if [ -f "$f" ]; then
                echo "--- $f"
                tail -c 6000 "$f" | tr -d '\r'
                echo
              fi
            done
            echo '```'
          } > /tmp/report.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/report.md > /dev/null || echo "comment failed"

      - name: Публикация APK в релиз 'debug-latest'
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=debug-latest
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Отладочные сборки" \
              --notes "Свежая CI-сборка debug APK. Ассет перезаписывается при каждой успешной сборке; точный коммит смотрите в запуске workflow." \
              --target "${{ github.sha }}"
          gh release upload "$TAG" apkEditorPro/build/outputs/apk/debug/*.apk --clobber
          echo "published to https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Загрузка APK (артефакт)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apkEditorPro-debug
          path: |
            apkEditorPro/build/outputs/apk/debug/*.apk
            apkEditorPro/build/outputs/logs/*.txt
          if-no-files-found: warn

    reference:
      name: Цепочка прогресса в эталонном APK
      runs-on: ubuntu-latest
      timeout-minutes: 15
      permissions:
        contents: write
      steps:
        - name: Подготовка Java и эталона
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
        - name: Разбор только классов преобразования DEX
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            set -euo pipefail
            gh release download test -R "$GITHUB_REPOSITORY" -p 'APK.Editor.+_v1.10.0.175.175.apk' -D reference
            gh release download v1.5.6 -R skylot/jadx -p jadx-1.5.6.zip -D jadx
            unzip -q jadx/jadx-1.5.6.zip -d jadx/tool
            for class in com.gmail.heagoo.apkeditor.smali.AsyncDecodeTask com.gmail.heagoo.apkeditor.pro.DexDecoder com.gmail.heagoo.apkeditor.pro.FastDexDisassembler; do
              JAVA_OPTS='-Xmx4g' jadx/tool/bin/jadx --no-res --no-debug-info --single-class "$class" --single-class-output "reference/$class.java" reference/*.apk > "reference/$class.log" 2>&1 || true
            done
            {
              echo '## Эталон 175: задача, декодер и параллельный разбор'
              for f in reference/*.java; do
                echo '### '"$f"
                echo '```java'
                head -c 17000 "$f"
                echo
                echo '```'
              done
            } > reference/report.md
            gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@reference/report.md
