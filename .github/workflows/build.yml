name: Сборка

on:
  push:
  workflow_dispatch:

jobs:
  debug-apk:
    name: Сборка debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установка пакетов Android SDK
        run: |
          set +e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT" ANDROID_HOME="$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || true
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /tmp/licenses.log 2>&1
          "$SDKMANAGER" --list_installed > /tmp/installed.log 2>&1
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" > /tmp/sdk.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(tail -n 30 /tmp/sdk.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=SDK install failed::$msg"
            exit $code
          fi

      - name: Юнит-тесты (манифест, DEX, темы, сортировка, диагностика и переводы)
        run: |
          set +e
          ./gradlew :_AndroidCommon:testDebugUnitTest :appListUtil:testDebugUnitTest :appDataEditor:testDebugUnitTest :httpServer:testDebugUnitTest :apkEditor:testDebugUnitTest :apkEditorPlus:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace > /tmp/test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -A 12 -m 1 -E "^FAILURE:|What went wrong|FAILED" /tmp/test.log | head -n 40 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -z "$msg" ] && msg=$(tail -n 30 /tmp/test.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Unit tests failed::$msg"
            tail -n 60 /tmp/test.log
            echo "--- AAPT/resource errors"
            grep -n -E "error:|AAPT|Android resource linking failed|\.xml:[0-9]+" /tmp/test.log | head -n 100 || true
            for report in _AndroidCommon/build/test-results/testDebugUnitTest/TEST-*.xml appListUtil/build/test-results/testDebugUnitTest/TEST-*.xml appDataEditor/build/test-results/testDebugUnitTest/TEST-*.xml httpServer/build/test-results/testDebugUnitTest/TEST-*.xml apkEditor/build/test-results/testDebugUnitTest/TEST-*.xml apkEditorPlus/build/test-results/testDebugUnitTest/TEST-*.xml; do
              if [ -f "$report" ]; then
                echo "--- $report"
                cat "$report"
              fi
            done
            exit $code
          fi
          tail -n 15 /tmp/test.log

      - name: Проверка AAPT2 для dummy-ресурсов
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2="$SDK_ROOT/build-tools/37.0.0/aapt2"
          mkdir -p /tmp/dummy-aapt2/res/values
          printf '%s\n' '<resources><item type="anim" name="dummy_ae_0">@null</item><item type="animator" name="dummy_ae_1">@null</item></resources>' > /tmp/dummy-aapt2/res/values/dummy.xml
          printf '%s\n' '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.dummy"><application/></manifest>' > /tmp/dummy-aapt2/AndroidManifest.xml
          "$AAPT2" compile --legacy --no-crunch --dir /tmp/dummy-aapt2/res -o /tmp/dummy-aapt2/flats.zip
          "$AAPT2" link -I "$SDK_ROOT/platforms/android-37.0/android.jar" --manifest /tmp/dummy-aapt2/AndroidManifest.xml -o /tmp/dummy-aapt2/test.apk /tmp/dummy-aapt2/flats.zip

      - name: Сборка debug APK
        run: |
          set +e
          ./gradlew :apkEditorPlus:assembleDebug --no-daemon --max-workers=2 --stacktrace > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -A 12 -m 1 -E "^FAILURE:|What went wrong" /tmp/build.log | head -n 40 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -z "$msg" ] && msg=$(tail -n 30 /tmp/build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            tail -n 60 /tmp/build.log
            exit $code
          fi
          tail -n 15 /tmp/build.log

      - name: Отчёт об ошибке
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Диагностика сборки'
            echo '```'
            for f in /tmp/installed.log /tmp/sdk.log /tmp/test.log /tmp/build.log apkEditorPlus/build/test-results/testDebugUnitTest/TEST-*.xml; do
              if [ -f "$f" ]; then
                echo "--- $f"
                tail -c 6000 "$f" | tr -d '\r'
                echo
              fi
            done
            if [ -f /tmp/test.log ]; then
              echo "--- junit failures"
          for f in apkEditor/build/test-results/testDebugUnitTest/TEST-*.xml apkEditorPlus/build/test-results/testDebugUnitTest/TEST-*.xml; do
            [ -f "$f" ] || continue
            grep -B1 -A8 '<failure' "$f" | head -n 80 || true
          done
          echo "--- resource errors"
              grep -n -E "error:|AAPT|Android resource linking failed|\.xml:[0-9]+" /tmp/test.log | head -n 120 || true
            fi
            echo '```'
          } > /tmp/report.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/report.md > /dev/null || echo "comment failed"

      - name: Публикация APK в релиз 'debug-latest'
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=debug-latest
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Отладочные сборки" \
              --notes "Свежая CI-сборка debug APK. Ассет перезаписывается при каждой успешной сборке; точный коммит смотрите в запуске workflow." \
              --target "${{ github.sha }}"
          gh release upload "$TAG" apkEditorPlus/build/outputs/apk/debug/*.apk --clobber
          # The module was renamed Pro -> Plus; drop the stale Pro-named asset if present.
          gh release delete-asset "$TAG" apkEditorPro-debug.apk --yes || true
          echo "published to https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Загрузка APK (артефакт)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apkEditorPlus-debug
          path: |
            apkEditorPlus/build/outputs/apk/debug/*.apk
            apkEditorPlus/build/outputs/logs/*.txt
          if-no-files-found: warn
