name: build

on:
  push:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          set +e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT" ANDROID_HOME="$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || true
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /tmp/licenses.log 2>&1
          "$SDKMANAGER" --list_installed > /tmp/installed.log 2>&1
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;30.0.16248370" > /tmp/sdk.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(tail -n 30 /tmp/sdk.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=SDK install failed::$msg"
            exit $code
          fi

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :apkEditorPro:assembleDebug --no-daemon --max-workers=2 --stacktrace > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -A 12 -m 1 -E "^FAILURE:|What went wrong" /tmp/build.log | head -n 40 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -z "$msg" ] && msg=$(tail -n 30 /tmp/build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            tail -n 60 /tmp/build.log
            exit $code
          fi
          tail -n 15 /tmp/build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apkEditorPro-debug
          path: |
            apkEditorPro/build/outputs/apk/debug/*.apk
            apkEditorPro/build/outputs/logs/*.txt
          if-no-files-found: warn
