name: build

on:
  push:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Install NDK
        run: sdkmanager "ndk;30.0.16248370"

      - name: Build debug APK
        run: ./gradlew :apkEditorPro:assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apkEditorPro-debug
          path: |
            apkEditorPro/build/outputs/apk/debug/*.apk
            apkEditorPro/build/outputs/logs/*.txt
          if-no-files-found: warn
